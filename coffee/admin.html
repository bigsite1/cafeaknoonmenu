<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>پنل مدیریت</title>
<link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet">
<style>
:root {
  --gold: #f5b301;
  --dark: #1a1a1a;
  --bg: #f5f5f5;
  --card: #fff;
  --border: #e5e5e5;
  --text: #222;
  --muted: #888;
  --danger: #ef4444;
  --success: #22c55e;
}
* { box-sizing: border-box; }
body { font-family: Vazirmatn, Tahoma, sans-serif; margin: 0; background: var(--bg); color: var(--text); }
.topbar { background: var(--dark); color: #fff; padding: 12px 20px; display: flex; justify-content: space-between; align-items: center; }
.topbar h1 { margin: 0; font-size: 16px; color: var(--gold); }
.topbar button { background: var(--danger); color: #fff; border: 0; padding: 8px 14px; border-radius: 6px; cursor: pointer; font-family: inherit; }
.nav { background: #fff; display: flex; overflow-x: auto; border-bottom: 1px solid var(--border); }
.nav button {
  flex: 1; padding: 14px 12px; background: none; border: 0; cursor: pointer;
  font-family: inherit; font-size: 14px; color: var(--muted);
  border-bottom: 3px solid transparent; white-space: nowrap; min-width: 110px;
}
.nav button.active { color: var(--gold); border-color: var(--gold); font-weight: bold; }
.nav button .badge { background: var(--danger); color: #fff; font-size: 10px; padding: 2px 6px; border-radius: 10px; margin-right: 4px; }
.container { max-width: 1000px; margin: 0 auto; padding: 16px; }
.panel { background: var(--card); border-radius: 12px; padding: 20px; margin-bottom: 16px; box-shadow: 0 1px 3px rgba(0,0,0,.05); }
.panel h2 { margin: 0 0 16px; font-size: 16px; }
.field { margin-bottom: 12px; }
.field label { display: block; font-size: 13px; margin-bottom: 6px; color: #555; }
.field input, .field textarea, .field select {
  width: 100%; padding: 10px; border: 1px solid var(--border);
  border-radius: 8px; font-family: inherit; font-size: 14px; background: #fff;
}
.field textarea { resize: vertical; min-height: 70px; }
.row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
@media (max-width: 600px) { .row { grid-template-columns: 1fr; } }
.btn { padding: 10px 20px; border: 0; border-radius: 8px; cursor: pointer; font-family: inherit; font-size: 14px; font-weight: bold; }
.btn-primary { background: var(--gold); color: #000; }
.btn-primary:hover { background: #fbbf24; }
.btn-secondary { background: #e5e5e5; color: #333; }
.btn-danger { background: var(--danger); color: #fff; }
.btn-sm { padding: 6px 10px; font-size: 12px; }
.actions { display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap; }
table { width: 100%; border-collapse: collapse; }
th, td { padding: 10px; text-align: right; border-bottom: 1px solid var(--border); font-size: 13px; vertical-align: middle; }
th { background: #fafafa; color: #666; font-weight: 600; font-size: 12px; }
td img { width: 44px; height: 44px; object-fit: cover; border-radius: 6px; }
.tag { display: inline-block; font-size: 11px; padding: 3px 8px; border-radius: 10px; background: #f0f0f0; color: #666; }
.tag.green { background: #dcfce7; color: #166534; }
.tag.red { background: #fee2e2; color: #991b1b; }
.tag.yellow { background: #fef3c7; color: #92400e; }
.tag.blue { background: #dbeafe; color: #1e40af; }
.gallery-thumb { position: relative; display: inline-block; margin: 4px; }
.gallery-thumb img { width: 70px; height: 70px; object-fit: cover; border-radius: 8px; border: 1px solid var(--border); }
.gallery-thumb button {
  position: absolute; top: -6px; right: -6px;
  width: 22px; height: 22px; border-radius: 50%;
  background: var(--danger); color: #fff; border: 2px solid #fff;
  font-size: 12px; line-height: 1; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
}
.empty { text-align: center; color: var(--muted); padding: 40px; }
.hint { font-size: 12px; color: var(--muted); margin-top: 4px; }
.thumb { width: 44px; height: 44px; border-radius: 6px; object-fit: cover; background: #eee; }
.hidden { display: none !important; }
</style>
</head>
<body>

<div class="topbar">
  <h1>🛠️ پنل مدیریت کافه</h1>
  <button id="logoutBtn">خروج</button>
</div>

<div class="nav">
  <button data-tab="orders" class="active">📋 سفارش‌ها <span class="badge hidden" id="newOrdersBadge">0</span></button>
  <button data-tab="products">☕ محصولات</button>
  <button data-tab="categories">📁 دسته‌بندی‌ها</button>
  <button data-tab="settings">⚙️ تنظیمات</button>
</div>

<div class="container">

<!-- ============ TAB: ORDERS ============ -->
<div id="tab-orders">
  <div class="panel">
    <h2>سفارش‌های جدید</h2>
    <div id="ordersList"><div class="empty">در حال بارگذاری...</div></div>
  </div>
</div>

<!-- ============ TAB: PRODUCTS ============ -->
<div id="tab-products" class="hidden">
  <div class="panel">
    <h2 id="prodFormTitle">افزودن محصول جدید</h2>
    <form id="prodForm">
      <input type="hidden" id="pId">
      <div class="row">
        <div class="field"><label>نام</label><input id="pName" required></div>
        <div class="field"><label>قیمت (تومان)</label><input id="pPrice" type="number" required min="0"></div>
      </div>
      <div class="field">
        <label>دسته‌بندی</label>
        <select id="pCat"><option value="">— انتخاب —</option></select>
      </div>
      <div class="field"><label>توضیحات</label><textarea id="pDesc"></textarea></div>
      <div class="field">
        <label><input type="checkbox" id="pAvail" checked style="width:auto"> موجود است</label>
      </div>
      <div class="field">
        <label>عکس اصلی (کارت محصول)</label>
        <input type="file" id="pImage" accept="image/*">
        <div class="hint">اگر در حالت ویرایش عکس جدید ندهید، عکس قبلی حفظ می‌شود.</div>
        <div id="pImagePreview"></div>
      </div>
      <div class="field">
        <label>عکس‌های گالری (چندتایی)</label>
        <input type="file" id="pGallery" accept="image/*" multiple>
        <div class="hint">این عکس‌ها در صفحه جزئیات محصول (اسلایدشو) نشان داده می‌شوند.</div>
        <div id="pGalleryPreview"></div>
      </div>
      <div class="actions">
        <button type="submit" class="btn btn-primary">ذخیره</button>
        <button type="button" class="btn btn-secondary" id="cancelEdit" style="display:none">لغو ویرایش</button>
      </div>
      <div id="pProgress" class="hint"></div>
    </form>
  </div>
  <div class="panel">
    <h2>لیست محصولات</h2>
    <div id="productsList"><div class="empty">در حال بارگذاری...</div></div>
  </div>
</div>

<!-- ============ TAB: CATEGORIES ============ -->
<div id="tab-categories" class="hidden">
  <div class="panel">
    <h2 id="catFormTitle">افزودن دسته‌بندی</h2>
    <form id="catForm">
      <input type="hidden" id="catId">
      <div class="row">
        <div class="field"><label>نام</label><input id="catName" required></div>
        <div class="field"><label>ترتیب نمایش</label><input id="catSort" type="number" value="0"></div>
      </div>
      <div class="actions">
        <button type="submit" class="btn btn-primary">ذخیره</button>
        <button type="button" class="btn btn-secondary" id="cancelCat" style="display:none">لغو</button>
      </div>
    </form>
  </div>
  <div class="panel">
    <h2>لیست دسته‌بندی‌ها</h2>
    <div id="catsList"></div>
  </div>
</div>

<!-- ============ TAB: SETTINGS ============ -->
<div id="tab-settings" class="hidden">
  <div class="panel">
    <h2>تنظیمات کافه</h2>
    <form id="setForm">
      <div class="field"><label>نام کافه</label><input id="sName"></div>
      <div class="field"><label>شماره تماس</label><input id="sPhone"></div>
      <div class="field"><label>واتساپ</label><input id="sWhatsapp"></div>
      <div class="field"><label>اینستاگرام (بدون @)</label><input id="sInstagram"></div>
      <div class="field"><label>آدرس</label><textarea id="sAddress"></textarea></div>
      <div class="field">
        <label>لوگو</label>
        <input type="file" id="sLogo" accept="image/*">
        <div id="sLogoPreview" style="margin-top:8px"></div>
      </div>
      <div class="actions">
        <button type="submit" class="btn btn-primary">ذخیره تنظیمات</button>
      </div>
      <div id="sProgress" class="hint"></div>
    </form>
  </div>
</div>

</div>

<script src="config.js"></script>
<script type="module">
import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm'
const sb = createClient(window.SUPABASE_URL, window.SUPABASE_KEY)

const { data: { session } } = await sb.auth.getSession()
if (!session) { location.href = 'login.html'; throw new Error('no session') }

document.getElementById('logoutBtn').onclick = async () => {
  await sb.auth.signOut()
  location.href = 'login.html'
}

let categories = []
let products = []
let settings = {}
let editingProduct = null
let editingCat = null
let pollTimer = null
let lastOrderCount = 0

// ============ TABS ============
document.querySelectorAll('.nav button').forEach(btn => {
  btn.onclick = () => {
    document.querySelectorAll('.nav button').forEach(b => b.classList.remove('active'))
    btn.classList.add('active')
    document.querySelectorAll('.container > div').forEach(d => d.classList.add('hidden'))
    document.getElementById('tab-' + btn.dataset.tab).classList.remove('hidden')
    if (btn.dataset.tab === 'orders') loadOrders()
  }
})

// ============ LOAD DATA ============
async function loadAll() {
  const [c, p, s] = await Promise.all([
    sb.from('categories').select('*').order('sort_order'),
    sb.from('products').select('*').order('sort_order'),
    sb.from('settings').select('*').eq('id', 1).maybeSingle()
  ])
  categories = c.data || []
  products = p.data || []
  settings = s.data || {}
  renderCategoriesList()
  renderProductsList()
  renderCatSelect()
  renderSettings()
}

// ============ ORDERS ============
async function loadOrders() {
  const { data, error } = await sb.from('orders').select('*').order('created_at', { ascending: false }).limit(50)
  if (error) { document.getElementById('ordersList').innerHTML = `<div class="empty">خطا: ${error.message}</div>`; return }

  const newCount = data.filter(o => o.status === 'new').length
  const badge = document.getElementById('newOrdersBadge')
  if (newCount > 0) { badge.textContent = newCount; badge.classList.remove('hidden') }
  else badge.classList.add('hidden')

  if (!data.length) { document.getElementById('ordersList').innerHTML = '<div class="empty">هنوز سفارشی ثبت نشده</div>'; return }

  // Fetch items for each
  const orderIds = data.map(o => o.id)
  const { data: items } = await sb.from('order_items').select('*').in('order_id', orderIds)
  const itemsByOrder = {}
  ;(items || []).forEach(i => { (itemsByOrder[i.order_id] = itemsByOrder[i.order_id] || []).push(i) })

  document.getElementById('ordersList').innerHTML = data.map(o => {
    const its = itemsByOrder[o.id] || []
    const statusMap = { new: 'جدید', preparing: 'در حال آماده‌سازی', done: 'تحویل شده', cancelled: 'لغو شده' }
    const statusCls = { new: 'yellow', preparing: 'blue', done: 'green', cancelled: 'red' }
    const payMap = { cash: 'نقدی', card: 'کارت‌خوان', online: 'آنلاین' }
    const date = new Date(o.created_at).toLocaleString('fa-IR', { hour: '2-digit', minute: '2-digit', month: '2-digit', day: '2-digit' })
    return `
      <div style="border:1px solid var(--border);border-radius:10px;padding:14px;margin-bottom:12px">
        <div style="display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:8px">
          <div>
            <strong>سفارش #${o.id}</strong>
            <span class="tag">${o.table_number ? 'میز ' + o.table_number : '—'}</span>
            <span class="tag ${statusCls[o.status] || ''}">${statusMap[o.status] || o.status}</span>
            <span class="tag">${payMap[o.payment_method] || o.payment_method}</span>
          </div>
          <small style="color:var(--muted)">${date}</small>
        </div>
        <div style="margin:10px 0;font-size:13px;color:#555">
          ${o.customer_name ? `<div>👤 ${o.customer_name} ${o.customer_phone ? '— ' + o.customer_phone : ''}</div>` : ''}
          ${o.notes ? `<div>📝 ${o.notes}</div>` : ''}
        </div>
        <div style="font-size:13px;margin:8px 0">
          ${its.map(i => `<div>• ${i.name} × ${i.quantity} — ${Number(i.price * i.quantity).toLocaleString('fa-IR')} ت</div>`).join('')}
        </div>
        <div style="display:flex;justify-content:space-between;align-items:center;margin-top:10px;flex-wrap:wrap;gap:8px">
          <strong style="color:var(--gold)">جمع: ${Number(o.total).toLocaleString('fa-IR')} تومان</strong>
          <select onchange="updateOrderStatus(${o.id}, this.value)" style="padding:6px;border:1px solid var(--border);border-radius:6px;font-family:inherit">
            <option value="new" ${o.status==='new'?'selected':''}>جدید</option>
            <option value="preparing" ${o.status==='preparing'?'selected':''}>در حال آماده‌سازی</option>
            <option value="done" ${o.status==='done'?'selected':''}>تحویل شده</option>
            <option value="cancelled" ${o.status==='cancelled'?'selected':''}>لغو</option>
          </select>
        </div>
      </div>`
  }).join('')
}

window.updateOrderStatus = async (id, status) => {
  await sb.from('orders').update({ status }).eq('id', id)
  loadOrders()
}

// ============ CATEGORIES ============
function renderCategoriesList() {
  const el = document.getElementById('catsList')
  if (!categories.length) { el.innerHTML = '<div class="empty">دسته‌بندی‌ای نیست</div>'; return }
  el.innerHTML = `<table><thead><tr><th>نام</th><th>ترتیب</th><th>عملیات</th></tr></thead><tbody>
    ${categories.map(c => `<tr>
      <td>${c.name}</td>
      <td>${c.sort_order}</td>
      <td>
        <button class="btn btn-secondary btn-sm" onclick="editCat(${c.id})">ویرایش</button>
        <button class="btn btn-danger btn-sm" onclick="delCat(${c.id})">حذف</button>
      </td>
    </tr>`).join('')}
  </tbody></table>`
}

function renderCatSelect() {
  const sel = document.getElementById('pCat')
  sel.innerHTML = '<option value="">— انتخاب —</option>' +
    categories.map(c => `<option value="${c.id}">${c.name}</option>`).join('')
}

window.editCat = (id) => {
  const c = categories.find(x => x.id === id)
  if (!c) return
  editingCat = id
  document.getElementById('catId').value = id
  document.getElementById('catName').value = c.name
  document.getElementById('catSort').value = c.sort_order
  document.getElementById('catFormTitle').textContent = 'ویرایش دسته‌بندی'
  document.getElementById('cancelCat').style.display = 'inline-block'
  window.scrollTo({ top: 0, behavior: 'smooth' })
}

document.getElementById('cancelCat').onclick = () => {
  editingCat = null
  document.getElementById('catForm').reset()
  document.getElementById('catId').value = ''
  document.getElementById('catFormTitle').textContent = 'افزودن دسته‌بندی'
  document.getElementById('cancelCat').style.display = 'none'
}

document.getElementById('catForm').onsubmit = async (e) => {
  e.preventDefault()
  const payload = {
    name: document.getElementById('catName').value.trim(),
    sort_order: +document.getElementById('catSort').value || 0
  }
  let err
  if (editingCat) {
    ;({ error: err } = await sb.from('categories').update(payload).eq('id', editingCat))
  } else {
    ;({ error: err } = await sb.from('categories').insert(payload))
  }
  if (err) { alert('خطا: ' + err.message); return }
  document.getElementById('cancelCat').click()
  await loadAll()
}

window.delCat = async (id) => {
  if (!confirm('این دسته حذف شود؟ محصولاتش بدون دسته می‌شوند.')) return
  await sb.from('categories').delete().eq('id', id)
  await loadAll()
}

// ============ PRODUCTS ============
function renderProductsList() {
  const el = document.getElementById('productsList')
  if (!products.length) { el.innerHTML = '<div class="empty">محصولی ثبت نشده</div>'; return }
  const catName = (id) => categories.find(c => c.id === id)?.name || '—'
  el.innerHTML = `<table><thead><tr><th>عکس</th><th>نام</th><th>قیمت</th><th>دسته</th><th>وضعیت</th><th>عملیات</th></tr></thead><tbody>
    ${products.map(p => `<tr>
      <td>${p.image_url ? `<img src="${p.image_url}">` : '—'}</td>
      <td>${p.name}</td>
      <td>${Number(p.price).toLocaleString('fa-IR')}</td>
      <td>${catName(p.category_id)}</td>
      <td>${p.available ? '<span class="tag green">موجود</span>' : '<span class="tag red">ناموجود</span>'}</td>
      <td>
        <button class="btn btn-secondary btn-sm" onclick="editProduct(${p.id})">ویرایش</button>
        <button class="btn btn-danger btn-sm" onclick="delProduct(${p.id})">حذف</button>
      </td>
    </tr>`).join('')}
  </tbody></table>`
}

window.editProduct = async (id) => {
  const p = products.find(x => x.id === id)
  if (!p) return
  editingProduct = id
  document.getElementById('pId').value = id
  document.getElementById('pName').value = p.name
  document.getElementById('pPrice').value = p.price
  document.getElementById('pCat').value = p.category_id || ''
  document.getElementById('pDesc').value = p.description || ''
  document.getElementById('pAvail').checked = p.available
  document.getElementById('pImage').value = ''
  document.getElementById('pGallery').value = ''
  document.getElementById('prodFormTitle').textContent = 'ویرایش محصول'
  document.getElementById('cancelEdit').style.display = 'inline-block'

  document.getElementById('pImagePreview').innerHTML = p.image_url
    ? `<div style="margin-top:8px"><span class="hint">عکس فعلی:</span><br><img src="${p.image_url}" style="width:100px;height:100px;object-fit:cover;border-radius:8px;margin-top:4px"></div>`
    : ''

  // Load gallery
  const { data: gallery } = await sb.from('product_images').select('*').eq('product_id', id).order('sort_order')
  document.getElementById('pGalleryPreview').innerHTML = (gallery && gallery.length)
    ? `<div style="margin-top:8px">${gallery.map(g => `
        <div class="gallery-thumb">
          <img src="${g.image_url}">
          <button type="button" onclick="delGalleryImage(${g.id}, ${id})">×</button>
        </div>`).join('')}</div>`
    : ''

  window.scrollTo({ top: 0, behavior: 'smooth' })
}

window.delGalleryImage = async (imgId, productId) => {
  if (!confirm('این عکس حذف شود؟')) return
  await sb.from('product_images').delete().eq('id', imgId)
  editProduct(productId)
}

document.getElementById('cancelEdit').onclick = () => {
  editingProduct = null
  document.getElementById('prodForm').reset()
  document.getElementById('pId').value = ''
  document.getElementById('pImagePreview').innerHTML = ''
  document.getElementById('pGalleryPreview').innerHTML = ''
  document.getElementById('prodFormTitle').textContent = 'افزودن محصول جدید'
  document.getElementById('cancelEdit').style.display = 'none'
}

async function uploadImage(file) {
  const path = `p-${Date.now()}-${Math.random().toString(36).slice(2)}-${file.name}`
  const { error } = await sb.storage.from('images').upload(path, file)
  if (error) throw error
  return sb.storage.from('images').getPublicUrl(path).data.publicUrl
}

document.getElementById('prodForm').onsubmit = async (e) => {
  e.preventDefault()
  const progress = document.getElementById('pProgress')
  progress.textContent = 'در حال ذخیره...'

  try {
    let imageUrl = null
    const primaryFile = document.getElementById('pImage').files[0]
    if (primaryFile) imageUrl = await uploadImage(primaryFile)

    const payload = {
      name: document.getElementById('pName').value.trim(),
      price: +document.getElementById('pPrice').value,
      category_id: document.getElementById('pCat').value ? +document.getElementById('pCat').value : null,
      description: document.getElementById('pDesc').value.trim() || null,
      available: document.getElementById('pAvail').checked
    }
    if (imageUrl) payload.image_url = imageUrl

    let productId = editingProduct
    if (editingProduct) {
      const { error } = await sb.from('products').update(payload).eq('id', editingProduct)
      if (error) throw error
    } else {
      const { data, error } = await sb.from('products').insert(payload).select().single()
      if (error) throw error
      productId = data.id
    }

    // Gallery uploads
    const galleryFiles = document.getElementById('pGallery').files
    if (galleryFiles && galleryFiles.length) {
      for (let i = 0; i < galleryFiles.length; i++) {
        const url = await uploadImage(galleryFiles[i])
        await sb.from('product_images').insert({ product_id: productId, image_url: url, sort_order: i })
      }
    }

    progress.textContent = '✅ ذخیره شد'
    document.getElementById('cancelEdit').click()
    await loadAll()
    setTimeout(() => progress.textContent = '', 2000)
  } catch (err) {
    progress.textContent = 'خطا: ' + err.message
    console.error(err)
  }
}

window.delProduct = async (id) => {
  if (!confirm('این محصول حذف شود؟')) return
  await sb.from('products').delete().eq('id', id)
  await loadAll()
}

// ============ SETTINGS ============
function renderSettings() {
  document.getElementById('sName').value = settings.cafe_name || ''
  document.getElementById('sPhone').value = settings.phone || ''
  document.getElementById('sWhatsapp').value = settings.whatsapp || ''
  document.getElementById('sInstagram').value = settings.instagram || ''
  document.getElementById('sAddress').value = settings.address || ''
  document.getElementById('sLogoPreview').innerHTML = settings.logo_url
    ? `<img src="${settings.logo_url}" style="width:80px;height:80px;object-fit:cover;border-radius:50%;border:2px solid var(--gold)">`
    : ''
}

document.getElementById('setForm').onsubmit = async (e) => {
  e.preventDefault()
  const progress = document.getElementById('sProgress')
  progress.textContent = 'در حال ذخیره...'
  try {
    let logoUrl = settings.logo_url
    const logoFile = document.getElementById('sLogo').files[0]
    if (logoFile) logoUrl = await uploadImage(logoFile)

    const { error } = await sb.from('settings').update({
      cafe_name: document.getElementById('sName').value.trim() || 'کافه',
      phone: document.getElementById('sPhone').value.trim() || null,
      whatsapp: document.getElementById('sWhatsapp').value.trim() || null,
      instagram: document.getElementById('sInstagram').value.trim() || null,
      address: document.getElementById('sAddress').value.trim() || null,
      logo_url: logoUrl,
      updated_at: new Date().toISOString()
    }).eq('id', 1)
    if (error) throw error
    progress.textContent = '✅ ذخیره شد'
    await loadAll()
    setTimeout(() => progress.textContent = '', 2000)
  } catch (err) {
    progress.textContent = 'خطا: ' + err.message
  }
}

// ============ POLLING ============
function startPolling() {
  if (pollTimer) return
  pollTimer = setInterval(async () => {
    const { data } = await sb.from('orders').select('id,status').eq('status', 'new')
    const count = data?.length || 0
    const badge = document.getElementById('newOrdersBadge')
    if (count > 0) { badge.textContent = count; badge.classList.remove('hidden') }
    else badge.classList.add('hidden')
    if (count > lastOrderCount && lastOrderCount > 0) {
      // optional: play sound or notify
    }
    lastOrderCount = count
  }, 15000)
}

loadAll().then(startPolling)
</script>
